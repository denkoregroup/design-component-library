<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Section Builder - Guided Web Design</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Fraunces:wght@300;700;900&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-bg: #fefcfb;
      --color-surface: #ffffff;
      --color-border: #e8e3df;
      --color-text: #1a1614;
      --color-text-muted: #6b6560;
      --color-primary: #d97706;
      --color-primary-light: #f59e0b;
      --color-primary-dark: #b45309;
      --color-success: #059669;
      --color-info: #0891b2;
      
      --font-body: 'Instrument Sans', sans-serif;
      --font-display: 'Fraunces', serif;
      
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
    }

    body {
      font-family: var(--font-body);
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6;
    }

    /* Layout */
    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 2rem;
      border-bottom: 2px solid var(--color-border);
      background: var(--color-surface);
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 900;
      color: var(--color-primary);
      margin-bottom: 0.5rem;
    }

    .tagline {
      color: var(--color-text-muted);
      font-size: 1rem;
    }

    .main {
      flex: 1;
      padding: 3rem 2rem;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Progress Bar */
    .progress-container {
      margin-bottom: 3rem;
    }

    .progress-steps {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      position: relative;
    }

    .progress-line {
      position: absolute;
      top: 1.25rem;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--color-border);
      z-index: 0;
    }

    .progress-line-fill {
      height: 100%;
      background: var(--color-primary);
      transition: width 0.3s ease;
    }

    .progress-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      position: relative;
      z-index: 1;
    }

    .progress-dot {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      border: 2px solid var(--color-border);
      background: var(--color-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.875rem;
      transition: all 0.3s ease;
    }

    .progress-step.active .progress-dot {
      border-color: var(--color-primary);
      background: var(--color-primary);
      color: white;
    }

    .progress-step.completed .progress-dot {
      border-color: var(--color-success);
      background: var(--color-success);
      color: white;
    }

    .progress-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-text-muted);
      text-align: center;
    }

    .progress-step.active .progress-label {
      color: var(--color-primary);
    }

    /* Question Card */
    .question-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 1rem;
      padding: 3rem;
      box-shadow: var(--shadow-md);
    }

    .question-number {
      font-family: var(--font-display);
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }

    .question-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .question-subtitle {
      color: var(--color-text-muted);
      font-size: 1.125rem;
      margin-bottom: 2.5rem;
    }

    /* Answer Options */
    .answer-options {
      display: grid;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .option-card {
      padding: 1.5rem;
      border: 2px solid var(--color-border);
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--color-surface);
    }

    .option-card:hover {
      border-color: var(--color-primary-light);
      background: rgba(217, 119, 6, 0.02);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .option-card.selected {
      border-color: var(--color-primary);
      background: rgba(217, 119, 6, 0.05);
      box-shadow: var(--shadow-md);
    }

    .option-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .option-icon {
      width: 3rem;
      height: 3rem;
      background: linear-gradient(135deg, var(--color-primary-light), var(--color-primary));
      border-radius: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .option-title {
      font-weight: 700;
      font-size: 1.125rem;
    }

    .option-description {
      color: var(--color-text-muted);
      font-size: 0.9375rem;
      line-height: 1.5;
    }

    /* Text Input */
    .input-group {
      margin-bottom: 2rem;
    }

    .input-label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--color-text);
    }

    .input-field {
      width: 100%;
      padding: 1rem;
      border: 2px solid var(--color-border);
      border-radius: 0.5rem;
      font-family: var(--font-body);
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
    }

    textarea.input-field {
      min-height: 120px;
      resize: vertical;
    }

    /* Navigation Buttons */
    .nav-buttons {
      display: flex;
      gap: 1rem;
      justify-content: space-between;
      margin-top: 2rem;
    }

    .btn {
      padding: 1rem 2rem;
      border: none;
      border-radius: 0.5rem;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: var(--color-primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--color-primary-dark);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--color-text);
      border: 2px solid var(--color-border);
    }

    .btn-secondary:hover {
      border-color: var(--color-primary);
      background: rgba(217, 119, 6, 0.02);
    }

    /* Preview Section */
    .preview-container {
      margin-top: 3rem;
      padding: 2rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 1rem;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--color-border);
    }

    .preview-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
    }

    .preview-actions {
      display: flex;
      gap: 0.5rem;
    }

    .preview-frame {
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 0.5rem;
      overflow: hidden;
      min-height: 400px;
    }

    /* Summary View */
    .summary-grid {
      display: grid;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .summary-item {
      padding: 1.5rem;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 0.75rem;
    }

    .summary-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .summary-value {
      font-size: 1.125rem;
      font-weight: 600;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      padding: 1rem 1.5rem;
      background: var(--color-text);
      color: white;
      border-radius: 0.5rem;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 600;
      transform: translateY(150px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .logo {
        font-size: 1.5rem;
      }

      .question-card {
        padding: 2rem 1.5rem;
      }

      .question-title {
        font-size: 1.5rem;
      }

      .progress-label {
        font-size: 0.65rem;
      }

      .nav-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Wait for React to load
    if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
      console.error('React libraries not loaded');
      document.body.innerHTML = '<div style="padding: 2rem; text-align: center;"><h1>Loading...</h1><p>If this persists, please refresh the page.</p></div>';
      throw new Error('React not loaded');
    }

    const { useState, useEffect } = React;

    // Question Flow Configuration
    const SECTION_FLOWS = {
      hero: {
        name: 'Hero Section',
        steps: [
          {
            id: 'emotion',
            type: 'choice',
            question: 'What emotion should visitors feel?',
            subtitle: 'This sets the tone for your entire site',
            options: [
              { id: 'trust', label: 'Trust & Credibility', icon: '🛡️', description: 'Professional, reliable, established' },
              { id: 'excitement', label: 'Excitement & Energy', icon: '⚡', description: 'Dynamic, bold, attention-grabbing' },
              { id: 'calm', label: 'Calm & Welcoming', icon: '🌿', description: 'Peaceful, inviting, comfortable' },
              { id: 'luxury', label: 'Premium & Exclusive', icon: '✨', description: 'Sophisticated, high-end, refined' }
            ]
          },
          {
            id: 'action',
            type: 'choice',
            question: 'What is the primary action?',
            subtitle: 'What do you want visitors to do first?',
            options: [
              { id: 'book', label: 'Make a Reservation', icon: '📅', description: 'Book a table, schedule appointment' },
              { id: 'contact', label: 'Get in Touch', icon: '💬', description: 'Contact form, inquiry, quote' },
              { id: 'explore', label: 'Explore Offerings', icon: '🔍', description: 'Browse menu, view services, learn more' },
              { id: 'purchase', label: 'Buy Now', icon: '🛒', description: 'Direct purchase, add to cart' }
            ]
          },
          {
            id: 'visual',
            type: 'choice',
            question: 'Visual approach for hero?',
            subtitle: 'How should we capture attention?',
            options: [
              { id: 'photo', label: 'Stunning Photo', icon: '📸', description: 'Large hero image of product/space' },
              { id: 'video', label: 'Video Background', icon: '🎥', description: 'Looping video showing atmosphere' },
              { id: 'minimal', label: 'Minimal Text-First', icon: '📝', description: 'Bold headline with subtle background' },
              { id: 'split', label: 'Split Layout', icon: '⚖️', description: 'Text on one side, visual on other' }
            ]
          },
          {
            id: 'headline',
            type: 'text',
            question: 'Main headline',
            subtitle: 'What is the key message? (5-8 words works best)',
            placeholder: 'e.g., "Experience Fine Dining Under the Stars"'
          },
          {
            id: 'subheadline',
            type: 'text',
            question: 'Supporting text (optional)',
            subtitle: 'Expand on the headline (1-2 sentences)',
            placeholder: 'e.g., "Farm-to-table cuisine in our beautiful outdoor garden"',
            optional: true
          }
        ]
      },
      features: {
        name: 'Features Section',
        steps: [
          {
            id: 'count',
            type: 'choice',
            question: 'How many features to highlight?',
            subtitle: 'Focus on your strongest selling points',
            options: [
              { id: '3', label: 'Three Features', icon: '3️⃣', description: 'Clean and focused (recommended)' },
              { id: '4', label: 'Four Features', icon: '4️⃣', description: 'Balanced grid layout' },
              { id: '6', label: 'Six Features', icon: '6️⃣', description: 'Comprehensive overview' }
            ]
          },
          {
            id: 'style',
            type: 'choice',
            question: 'How should features be presented?',
            subtitle: 'Choose the best format for your content',
            options: [
              { id: 'icons', label: 'Icon Grid', icon: '🎯', description: 'Simple icons with text' },
              { id: 'photos', label: 'Photo Cards', icon: '🖼️', description: 'Images for each feature' },
              { id: 'alternating', label: 'Alternating Layout', icon: '↔️', description: 'Text and images alternate' },
              { id: 'minimal', label: 'Text-Only List', icon: '📋', description: 'Clean, professional list' }
            ]
          },
          {
            id: 'feature1',
            type: 'text',
            question: 'Feature #1',
            subtitle: 'What is your top selling point?',
            placeholder: 'e.g., "Outdoor Patio Seating"'
          },
          {
            id: 'feature2',
            type: 'text',
            question: 'Feature #2',
            subtitle: 'Second most important feature',
            placeholder: 'e.g., "Craft Cocktail Bar"'
          },
          {
            id: 'feature3',
            type: 'text',
            question: 'Feature #3',
            subtitle: 'Third key feature',
            placeholder: 'e.g., "Live Music Weekends"'
          }
        ]
      },
      cta: {
        name: 'Call-to-Action',
        steps: [
          {
            id: 'urgency',
            type: 'choice',
            question: 'Is there urgency or scarcity?',
            subtitle: 'Does this offer have a time limit or limited availability?',
            options: [
              { id: 'none', label: 'No Urgency', icon: '🔄', description: 'Evergreen, always available' },
              { id: 'seasonal', label: 'Seasonal/Limited Time', icon: '📆', description: 'Special menu, seasonal offer' },
              { id: 'limited', label: 'Limited Availability', icon: '⚠️', description: 'Limited seats, spots, inventory' },
              { id: 'event', label: 'Specific Event', icon: '🎉', description: 'One-time event or promotion' }
            ]
          },
          {
            id: 'goal',
            type: 'choice',
            question: 'Primary conversion goal?',
            subtitle: 'What action drives your business?',
            options: [
              { id: 'reservation', label: 'Reservation/Booking', icon: '📅', description: 'Book a table or appointment' },
              { id: 'email', label: 'Email Sign-up', icon: '✉️', description: 'Newsletter, updates, offers' },
              { id: 'contact', label: 'Contact/Quote', icon: '💬', description: 'Inquiry form, consultation' },
              { id: 'purchase', label: 'Direct Purchase', icon: '🛍️', description: 'Buy now, add to cart' }
            ]
          },
          {
            id: 'headline',
            type: 'text',
            question: 'CTA headline',
            subtitle: 'Compelling reason to take action',
            placeholder: 'e.g., "Reserve Your Table Tonight"'
          },
          {
            id: 'buttonText',
            type: 'text',
            question: 'Button text',
            subtitle: 'Clear action verb (2-3 words)',
            placeholder: 'e.g., "Book Now", "Get Started", "Join Free"'
          }
        ]
      }
    };

    // Main App Component
    function App() {
      const [selectedSection, setSelectedSection] = useState(null);
      const [currentStep, setCurrentStep] = useState(0);
      const [answers, setAnswers] = useState({});
      const [showPreview, setShowPreview] = useState(false);
      const [showToast, setShowToast] = useState(false);
      const [toastMessage, setToastMessage] = useState('');

      const flow = selectedSection ? SECTION_FLOWS[selectedSection] : null;
      const totalSteps = flow ? flow.steps.length : 0;
      const currentQuestion = flow ? flow.steps[currentStep] : null;

      const handleAnswer = (questionId, value) => {
        setAnswers({ ...answers, [questionId]: value });
      };

      const handleNext = () => {
        if (currentStep < totalSteps - 1) {
          setCurrentStep(currentStep + 1);
        } else {
          setShowPreview(true);
        }
      };

      const handleBack = () => {
        if (showPreview) {
          setShowPreview(false);
        } else if (currentStep > 0) {
          setCurrentStep(currentStep - 1);
        } else {
          setSelectedSection(null);
          setAnswers({});
        }
      };

      const handleReset = () => {
        setSelectedSection(null);
        setCurrentStep(0);
        setAnswers({});
        setShowPreview(false);
      };

      const canProceed = () => {
        if (!currentQuestion) return false;
        const answer = answers[currentQuestion.id];
        if (currentQuestion.optional) return true;
        return answer !== undefined && answer !== '';
      };

      const copyHTML = () => {
        const html = generateSectionHTML(selectedSection, answers);
        navigator.clipboard.writeText(html);
        setToastMessage('✓ HTML copied to clipboard!');
        setShowToast(true);
        setTimeout(() => setShowToast(false), 2500);
      };

      // Section Selection Screen
      if (!selectedSection) {
        return (
          <div className="app">
            <header className="header">
              <div className="header-content">
                <div className="logo">Section Builder</div>
                <div className="tagline">Guided website design, section by section</div>
              </div>
            </header>
            <main className="main">
              <div className="container">
                <div className="question-card">
                  <h2 className="question-title">Which section would you like to build?</h2>
                  <p className="question-subtitle">We'll guide you through specific questions to create the perfect section</p>
                  
                  <div className="answer-options">
                    <div className="option-card" onClick={() => setSelectedSection('hero')}>
                      <div className="option-header">
                        <div className="option-icon">🚀</div>
                        <div className="option-title">Hero Section</div>
                      </div>
                      <div className="option-description">
                        First impression, headline, and primary call-to-action
                      </div>
                    </div>

                    <div className="option-card" onClick={() => setSelectedSection('features')}>
                      <div className="option-header">
                        <div className="option-icon">⭐</div>
                        <div className="option-title">Features Section</div>
                      </div>
                      <div className="option-description">
                        Highlight your top services, products, or benefits
                      </div>
                    </div>

                    <div className="option-card" onClick={() => setSelectedSection('cta')}>
                      <div className="option-header">
                        <div className="option-icon">🎯</div>
                        <div className="option-title">Call-to-Action</div>
                      </div>
                      <div className="option-description">
                        Drive conversions with focused action sections
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </main>
          </div>
        );
      }

      // Preview/Summary Screen
      if (showPreview) {
        return (
          <div className="app">
            <header className="header">
              <div className="header-content">
                <div className="logo">Section Builder</div>
                <div className="tagline">{flow.name} - Preview</div>
              </div>
            </header>
            <main className="main">
              <div className="container">
                <div className="question-card">
                  <h2 className="question-title">Review Your {flow.name}</h2>
                  <p className="question-subtitle">Here's what we built based on your answers</p>

                  <div className="summary-grid">
                    {flow.steps.map(step => {
                      const answer = answers[step.id];
                      if (!answer) return null;

                      let displayValue = answer;
                      if (step.type === 'choice') {
                        const option = step.options.find(opt => opt.id === answer);
                        displayValue = option ? option.label : answer;
                      }

                      return (
                        <div key={step.id} className="summary-item">
                          <div className="summary-label">{step.question}</div>
                          <div className="summary-value">{displayValue}</div>
                        </div>
                      );
                    })}
                  </div>

                  <div className="preview-container">
                    <div className="preview-header">
                      <div className="preview-title">Live Preview</div>
                      <div className="preview-actions">
                        <button className="btn btn-primary" onClick={copyHTML}>
                          Copy HTML
                        </button>
                      </div>
                    </div>
                    <div className="preview-frame">
                      <SectionPreview sectionType={selectedSection} answers={answers} />
                    </div>
                  </div>

                  <div className="nav-buttons">
                    <button className="btn btn-secondary" onClick={handleBack}>
                      ← Edit Answers
                    </button>
                    <button className="btn btn-primary" onClick={handleReset}>
                      Build Another Section
                    </button>
                  </div>
                </div>
              </div>
            </main>
            <div className={`toast ${showToast ? 'show' : ''}`}>{toastMessage}</div>
          </div>
        );
      }

      // Question Flow Screen
      const progressPercent = ((currentStep + 1) / totalSteps) * 100;

      return (
        <div className="app">
          <header className="header">
            <div className="header-content">
              <div className="logo">Section Builder</div>
              <div className="tagline">{flow.name}</div>
            </div>
          </header>
          <main className="main">
            <div className="container">
              <div className="progress-container">
                <div className="progress-steps">
                  <div className="progress-line">
                    <div className="progress-line-fill" style={{ width: `${progressPercent}%` }}></div>
                  </div>
                  {flow.steps.map((step, index) => (
                    <div 
                      key={step.id}
                      className={`progress-step ${index < currentStep ? 'completed' : ''} ${index === currentStep ? 'active' : ''}`}
                    >
                      <div className="progress-dot">
                        {index < currentStep ? '✓' : index + 1}
                      </div>
                      <div className="progress-label">
                        {step.question.split(' ').slice(0, 2).join(' ')}
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="question-card">
                <div className="question-number">Question {currentStep + 1} of {totalSteps}</div>
                <h2 className="question-title">{currentQuestion.question}</h2>
                {currentQuestion.subtitle && (
                  <p className="question-subtitle">{currentQuestion.subtitle}</p>
                )}

                {currentQuestion.type === 'choice' && (
                  <div className="answer-options">
                    {currentQuestion.options.map(option => (
                      <div
                        key={option.id}
                        className={`option-card ${answers[currentQuestion.id] === option.id ? 'selected' : ''}`}
                        onClick={() => handleAnswer(currentQuestion.id, option.id)}
                      >
                        <div className="option-header">
                          <div className="option-icon">{option.icon}</div>
                          <div className="option-title">{option.label}</div>
                        </div>
                        <div className="option-description">{option.description}</div>
                      </div>
                    ))}
                  </div>
                )}

                {currentQuestion.type === 'text' && (
                  <div className="input-group">
                    <input
                      type="text"
                      className="input-field"
                      placeholder={currentQuestion.placeholder}
                      value={answers[currentQuestion.id] || ''}
                      onChange={(e) => handleAnswer(currentQuestion.id, e.target.value)}
                      autoFocus
                    />
                  </div>
                )}

                <div className="nav-buttons">
                  <button className="btn btn-secondary" onClick={handleBack}>
                    ← Back
                  </button>
                  <button 
                    className="btn btn-primary" 
                    onClick={handleNext}
                    disabled={!canProceed()}
                  >
                    {currentStep < totalSteps - 1 ? 'Next →' : 'Preview Section'}
                  </button>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    // Preview Component
    function SectionPreview({ sectionType, answers }) {
      if (sectionType === 'hero') {
        return <HeroPreview answers={answers} />;
      } else if (sectionType === 'features') {
        return <FeaturesPreview answers={answers} />;
      } else if (sectionType === 'cta') {
        return <CTAPreview answers={answers} />;
      }
      return <div>Preview not available</div>;
    }

    // Hero Preview
    function HeroPreview({ answers }) {
      const { emotion, action, visual, headline, subheadline } = answers;

      const emotionColors = {
        trust: { bg: '#0891b2', light: '#06b6d4' },
        excitement: { bg: '#dc2626', light: '#f87171' },
        calm: { bg: '#059669', light: '#34d399' },
        luxury: { bg: '#7c3aed', light: '#a78bfa' }
      };

      const color = emotionColors[emotion] || emotionColors.trust;

      if (visual === 'split') {
        return (
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', minHeight: '500px' }}>
            <div style={{ padding: '4rem 3rem', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
              <h1 style={{ fontSize: '3rem', fontWeight: '900', fontFamily: 'Fraunces, serif', lineHeight: '1.1', marginBottom: '1.5rem' }}>
                {headline || 'Your Headline Here'}
              </h1>
              {subheadline && (
                <p style={{ fontSize: '1.25rem', color: '#6b6560', marginBottom: '2rem', lineHeight: '1.6' }}>
                  {subheadline}
                </p>
              )}
              <div>
                <button style={{ padding: '1rem 2rem', background: color.bg, color: 'white', border: 'none', borderRadius: '0.5rem', fontSize: '1.1rem', fontWeight: '600', cursor: 'pointer' }}>
                  {action === 'book' ? 'Make Reservation' : action === 'contact' ? 'Get in Touch' : action === 'explore' ? 'Learn More' : 'Get Started'}
                </button>
              </div>
            </div>
            <div style={{ background: `linear-gradient(135deg, ${color.light}, ${color.bg})` }}></div>
          </div>
        );
      }

      return (
        <div style={{ padding: '6rem 3rem', textAlign: 'center', background: `linear-gradient(135deg, ${color.light}, ${color.bg})`, minHeight: '500px', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
          <h1 style={{ fontSize: '4rem', fontWeight: '900', fontFamily: 'Fraunces, serif', color: 'white', lineHeight: '1.1', marginBottom: '1.5rem' }}>
            {headline || 'Your Headline Here'}
          </h1>
          {subheadline && (
            <p style={{ fontSize: '1.5rem', color: 'rgba(255,255,255,0.95)', marginBottom: '2.5rem', maxWidth: '700px', margin: '0 auto 2.5rem' }}>
              {subheadline}
            </p>
          )}
          <div>
            <button style={{ padding: '1.25rem 2.5rem', background: 'white', color: color.bg, border: 'none', borderRadius: '0.5rem', fontSize: '1.1rem', fontWeight: '700', cursor: 'pointer' }}>
              {action === 'book' ? 'Make Reservation' : action === 'contact' ? 'Get in Touch' : action === 'explore' ? 'Learn More' : 'Get Started'}
            </button>
          </div>
        </div>
      );
    }

    // Features Preview
    function FeaturesPreview({ answers }) {
      const { count, style, feature1, feature2, feature3 } = answers;
      const features = [feature1, feature2, feature3].filter(Boolean);
      
      // Safety check
      if (features.length === 0) {
        return <div style={{ padding: '4rem 3rem', textAlign: 'center', color: '#6b6560' }}>Add features to see preview</div>;
      }

      if (style === 'icons') {
        return (
          <div style={{ padding: '4rem 3rem' }}>
            <div style={{ display: 'grid', gridTemplateColumns: `repeat(${count || 3}, 1fr)`, gap: '2rem' }}>
              {features.map((feature, i) => (
                <div key={i} style={{ textAlign: 'center', padding: '2rem' }}>
                  <div style={{ width: '80px', height: '80px', background: 'linear-gradient(135deg, #f59e0b, #d97706)', borderRadius: '1rem', margin: '0 auto 1.5rem', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '2.5rem' }}>
                    {['⭐', '🎯', '✨'][i]}
                  </div>
                  <h3 style={{ fontSize: '1.5rem', fontWeight: '700', marginBottom: '0.75rem' }}>{feature}</h3>
                  <p style={{ color: '#6b6560' }}>Description of this amazing feature and why it matters to your customers.</p>
                </div>
              ))}
            </div>
          </div>
        );
      }

      return (
        <div style={{ padding: '4rem 3rem' }}>
          <div style={{ display: 'grid', gridTemplateColumns: `repeat(${count || 3}, 1fr)`, gap: '2rem' }}>
            {features.map((feature, i) => (
              <div key={i} style={{ background: 'white', border: '1px solid #e8e3df', borderRadius: '0.75rem', overflow: 'hidden' }}>
                <div style={{ height: '200px', background: 'linear-gradient(135deg, #f59e0b, #d97706)' }}></div>
                <div style={{ padding: '1.5rem' }}>
                  <h3 style={{ fontSize: '1.25rem', fontWeight: '700', marginBottom: '0.5rem' }}>{feature}</h3>
                  <p style={{ color: '#6b6560', fontSize: '0.9375rem' }}>Details about this feature go here.</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // CTA Preview
    function CTAPreview({ answers }) {
      const { urgency, goal, headline, buttonText } = answers;

      const hasUrgency = urgency && urgency !== 'none';

      return (
        <div style={{ padding: '5rem 3rem', textAlign: 'center', background: 'linear-gradient(135deg, #d97706, #b45309)', color: 'white', minHeight: '400px', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
          {hasUrgency && (
            <div style={{ display: 'inline-block', padding: '0.5rem 1rem', background: 'rgba(255,255,255,0.2)', borderRadius: '2rem', fontSize: '0.875rem', fontWeight: '700', marginBottom: '1.5rem' }}>
              {urgency === 'seasonal' ? '🎃 Limited Time Offer' : urgency === 'limited' ? '⚠️ Limited Spots' : '🎉 Special Event'}
            </div>
          )}
          <h2 style={{ fontSize: '3rem', fontWeight: '900', fontFamily: 'Fraunces, serif', marginBottom: '1.5rem' }}>
            {headline || 'Ready to Get Started?'}
          </h2>
          <p style={{ fontSize: '1.25rem', opacity: '0.95', marginBottom: '2.5rem', maxWidth: '600px', margin: '0 auto 2.5rem' }}>
            Join thousands of satisfied customers and experience the difference today.
          </p>
          {goal === 'email' ? (
            <div style={{ display: 'flex', gap: '1rem', maxWidth: '500px', margin: '0 auto' }}>
              <input type="email" placeholder="your@email.com" style={{ flex: 1, padding: '1rem', borderRadius: '0.5rem', border: 'none', fontSize: '1rem' }} />
              <button style={{ padding: '1rem 2rem', background: 'white', color: '#d97706', border: 'none', borderRadius: '0.5rem', fontSize: '1rem', fontWeight: '700', cursor: 'pointer' }}>
                {buttonText || 'Subscribe'}
              </button>
            </div>
          ) : (
            <button style={{ padding: '1.25rem 2.5rem', background: 'white', color: '#d97706', border: 'none', borderRadius: '0.5rem', fontSize: '1.1rem', fontWeight: '700', cursor: 'pointer' }}>
              {buttonText || 'Get Started'}
            </button>
          )}
        </div>
      );
    }

    // HTML Generation Function
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function generateSectionHTML(sectionType, answers) {
      let bodyContent = '';

      if (sectionType === 'hero') {
        const { emotion, action, visual, headline, subheadline } = answers;
        const emotionColors = {
          trust: { bg: '#0891b2', light: '#06b6d4' },
          excitement: { bg: '#dc2626', light: '#f87171' },
          calm: { bg: '#059669', light: '#34d399' },
          luxury: { bg: '#7c3aed', light: '#a78bfa' }
        };
        const color = emotionColors[emotion] || emotionColors.trust;
        const ctaText = action === 'book' ? 'Make Reservation' : action === 'contact' ? 'Get in Touch' : action === 'explore' ? 'Learn More' : 'Get Started';

        if (visual === 'split') {
          bodyContent = `
  <div style="display: grid; grid-template-columns: 1fr 1fr; min-height: 500px;">
    <div style="padding: 4rem 3rem; display: flex; flex-direction: column; justify-content: center;">
      <h1 style="font-size: 3rem; font-weight: 900; font-family: 'Fraunces', serif; line-height: 1.1; margin-bottom: 1.5rem;">
        ${escapeHtml(headline) || 'Your Headline Here'}
      </h1>
      ${subheadline ? `<p style="font-size: 1.25rem; color: #6b6560; margin-bottom: 2rem; line-height: 1.6;">${escapeHtml(subheadline)}</p>` : ''}
      <div>
        <button style="padding: 1rem 2rem; background: ${color.bg}; color: white; border: none; border-radius: 0.5rem; font-size: 1.1rem; font-weight: 600; cursor: pointer;">
          ${ctaText}
        </button>
      </div>
    </div>
    <div style="background: linear-gradient(135deg, ${color.light}, ${color.bg});"></div>
  </div>`;
        } else {
          bodyContent = `
  <div style="padding: 6rem 3rem; text-align: center; background: linear-gradient(135deg, ${color.light}, ${color.bg}); min-height: 500px; display: flex; flex-direction: column; justify-content: center;">
    <h1 style="font-size: 4rem; font-weight: 900; font-family: 'Fraunces', serif; color: white; line-height: 1.1; margin-bottom: 1.5rem;">
      ${escapeHtml(headline) || 'Your Headline Here'}
    </h1>
    ${subheadline ? `<p style="font-size: 1.5rem; color: rgba(255,255,255,0.95); margin-bottom: 2.5rem; max-width: 700px; margin: 0 auto 2.5rem;">${escapeHtml(subheadline)}</p>` : ''}
    <div>
      <button style="padding: 1.25rem 2.5rem; background: white; color: ${color.bg}; border: none; border-radius: 0.5rem; font-size: 1.1rem; font-weight: 700; cursor: pointer;">
        ${ctaText}
      </button>
    </div>
  </div>`;
        }
      } else if (sectionType === 'features') {
        const { count, style, feature1, feature2, feature3 } = answers;
        const features = [feature1, feature2, feature3].filter(Boolean);
        const icons = ['⭐', '🎯', '✨'];

        bodyContent = `
  <div style="padding: 4rem 3rem;">
    <div style="display: grid; grid-template-columns: repeat(${count}, 1fr); gap: 2rem;">
      ${features.map((feature, i) => `
      <div style="text-align: center; padding: 2rem;">
        <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #f59e0b, #d97706); border-radius: 1rem; margin: 0 auto 1.5rem; display: flex; align-items: center; justify-content: center; font-size: 2.5rem;">
          ${icons[i]}
        </div>
        <h3 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem;">${escapeHtml(feature)}</h3>
        <p style="color: #6b6560;">Description of this amazing feature and why it matters to your customers.</p>
      </div>
      `).join('')}
    </div>
  </div>`;
      } else if (sectionType === 'cta') {
        const { urgency, goal, headline, buttonText } = answers;
        const hasUrgency = urgency && urgency !== 'none';
        const urgencyBadge = urgency === 'seasonal' ? '🎃 Limited Time Offer' : urgency === 'limited' ? '⚠️ Limited Spots' : '🎉 Special Event';

        bodyContent = `
  <div style="padding: 5rem 3rem; text-align: center; background: linear-gradient(135deg, #d97706, #b45309); color: white;">
    ${hasUrgency ? `<div style="display: inline-block; padding: 0.5rem 1rem; background: rgba(255,255,255,0.2); border-radius: 2rem; font-size: 0.875rem; font-weight: 700; margin-bottom: 1.5rem;">${urgencyBadge}</div>` : ''}
    <h2 style="font-size: 3rem; font-weight: 900; font-family: 'Fraunces', serif; margin-bottom: 1.5rem;">
      ${escapeHtml(headline) || 'Ready to Get Started?'}
    </h2>
    <p style="font-size: 1.25rem; opacity: 0.95; margin-bottom: 2.5rem; max-width: 600px; margin: 0 auto 2.5rem;">
      Join thousands of satisfied customers and experience the difference today.
    </p>
    ${goal === 'email' ? `
    <div style="display: flex; gap: 1rem; max-width: 500px; margin: 0 auto;">
      <input type="email" placeholder="your@email.com" style="flex: 1; padding: 1rem; border-radius: 0.5rem; border: none; font-size: 1rem;" />
      <button style="padding: 1rem 2rem; background: white; color: #d97706; border: none; border-radius: 0.5rem; font-size: 1rem; font-weight: 700; cursor: pointer;">
        ${escapeHtml(buttonText) || 'Subscribe'}
      </button>
    </div>` : `
    <button style="padding: 1.25rem 2.5rem; background: white; color: #d97706; border: none; border-radius: 0.5rem; font-size: 1.1rem; font-weight: 700; cursor: pointer;">
      ${escapeHtml(buttonText) || 'Get Started'}
    </button>`}
  </div>`;
      }

      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;700;900&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Instrument Sans', sans-serif; line-height: 1.6; }
    @media (max-width: 768px) {
      [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
${bodyContent}
</body>
</html>`;
    }

    // Render App
    try {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    } catch (error) {
      console.error('Error rendering app:', error);
      document.getElementById('root').innerHTML = `
        <div style="padding: 3rem; text-align: center; font-family: system-ui, sans-serif;">
          <h1 style="color: #dc2626; margin-bottom: 1rem;">⚠️ Error Loading App</h1>
          <p style="color: #6b6560; margin-bottom: 1rem;">Please refresh the page to try again.</p>
          <button onclick="location.reload()" style="padding: 0.75rem 1.5rem; background: #d97706; color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 600;">
            Refresh Page
          </button>
          <details style="margin-top: 2rem; text-align: left; max-width: 600px; margin-left: auto; margin-right: auto;">
            <summary style="cursor: pointer; font-weight: 600;">Technical Details</summary>
            <pre style="background: #f5f5f5; padding: 1rem; border-radius: 0.5rem; overflow: auto; margin-top: 0.5rem;">${error.toString()}</pre>
          </details>
        </div>
      `;
    }
  </script>
</body>
</html>
